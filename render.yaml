services:
  - type: web
    name: e-library-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn e_library_system.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
